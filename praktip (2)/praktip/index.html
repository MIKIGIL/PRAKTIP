<!DOCTYPE html>
<!-- Landing page de PRAKTIP: banner, testimonios, servicios (mapa real y agente), quiénes somos, ODS y análisis económico. -->
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PRAKTIP</title>
  <!-- Tipografías de Google Fonts: Outfit (títulos) y Figtree (texto) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <!-- Hoja de estilos única de la web -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- Fondo fijo con degradados (decorativo) -->
<div class="bg"></div>

<!-- ============ CABECERA (barra fija, igual en todas las páginas) ============ -->
<header class="nav">
  <!-- Píldora izquierda: logo (icono de PRAKTIP) + menú principal + hamburguesa (móvil) -->
  <div class="nb g">
    <a class="logo" href="index.html" aria-label="PRAKTIP"><img class="logo-ic" src="img/icono.svg" alt="" width="43" height="32"><span>PRAKTIP</span></a>
    <nav class="links" aria-label="Main"><a class="nl on" href="index.html" aria-current="page" data-i18n="home"></a><a class="nl" href="practicas.html" data-i18n="prac"></a><a class="nl" href="buscador.html" data-i18n="find"></a><a class="nl" href="blog.html" data-i18n="blog"></a></nav>
    <button class="nl burger" id="burger" aria-expanded="false" aria-controls="dd" aria-label="Menu" data-ic="menu"></button>
  </div>
  <!-- Píldora derecha: acceso al login + selector de idioma EU/ES (main.js lo gestiona) -->
  <div class="nb g r">
    <a class="nl hm" href="login.html" data-i18n="login"></a>
    <div class="sw" role="group" aria-label="Language"><button data-lang="eu">EU</button><button data-lang="es">ES</button></div>
  </div>
  <!-- Menú desplegable de móvil (oculto hasta pulsar la hamburguesa) -->
  <nav class="dd g" id="dd" aria-label="Mobile" hidden><a class="nl on" href="index.html" aria-current="page" data-i18n="home"></a><a class="nl" href="practicas.html" data-i18n="prac"></a><a class="nl" href="buscador.html" data-i18n="find"></a><a class="nl" href="blog.html" data-i18n="blog"></a><a class="nl" href="login.html" data-i18n="login"></a></nav>
</header>

<main class="pg">
<!-- ============ BANNER PRINCIPAL (hero) ============ -->
<section class="hero">
  <!-- Columna izquierda: titular, subtítulo y botón que baja a «services» -->
  <div class="ht">
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="sub"></p>
    <a class="btn big" href="#services" data-i18n="cta"></a>
  </div>
  <!-- Columna derecha: dibujo animado. Líneas discontinuas que unen 3 nodos con el nodo central -->
  <div class="art" aria-hidden="true">
    <svg>
      <line x1="20%" y1="20%" x2="50%" y2="50%"/>
      <line x1="80%" y1="16%" x2="50%" y2="50%"/>
      <line x1="50%" y1="88%" x2="50%" y2="50%"/>
    </svg>
    <div class="node g n1" data-ic="cap" data-s="36"></div>   <!-- nodo: estudiante -->
    <div class="node g n2" data-ic="build" data-s="36"></div> <!-- nodo: empresa -->
    <div class="node g n3" data-ic="school" data-s="36"></div><!-- nodo: centro educativo -->
    <!-- Nodo central: AQUÍ va el icono de PRAKTIP (sustituye a la antigua estrellita) -->
    <div class="node g m n4"><img class="ic-big" src="img/icono.svg" alt="PRAKTIP"></div>
  </div>
</section>

<!-- ============ TESTIMONIOS (marquesina; las tarjetas las crea home.js) ============ -->
<section class="sec c nopb"><h2 data-i18n="tt"></h2><span class="tag" data-i18n="demo"></span></section>
<div class="mq mq-t"><div class="mt slow" id="testi"></div></div>

<!-- ============ SERVICIOS: mapa de empresas + agente inteligente ============ -->
<section class="svc" id="services">
  <!-- Mitad izquierda: acuerdos con empresas + MAPA REAL (Leaflet, lo crea map.js en #map-home) -->
  <div class="half g l">
    <h2 data-i18n="s1t"></h2>
    <p class="lead" data-i18n="s1s"></p>
    <span class="tag" data-i18n="dn"></span>
    <div id="map-home"></div>
    <a class="btn mint" href="practicas.html#book" data-i18n="call"></a>
  </div>
  <!-- Mitad derecha: pasos del agente (los pinta home.js en #steps) -->
  <div class="half g rt">
    <h2 data-i18n="s2t"></h2>
    <p class="lead" data-i18n="s2s"></p>
    <div class="steps" id="steps"></div>
    <a class="btn" href="buscador.html#trial" data-i18n="cta"></a>
  </div>
</section>

<!-- ============ QUIÉNES SOMOS ============ -->
<section class="sec ab">
  <!-- Texto -->
  <div><h2 data-i18n="abT"></h2><p data-i18n="p1"></p><p data-i18n="p2"></p></div>
  <!-- Recuadro con FOTO de personas de fondo (variable --photo) y los 3 nodos de cristal encima.
       Foto: Unsplash (Vitaly Gariev), licencia libre. Si no carga, se ve un degradado. -->
  <div class="tri photo" style="--photo:url('https://images.unsplash.com/photo-1758270705290-62b6294dd044?auto=format&fit=crop&w=1000&q=70')" aria-hidden="true">
    <svg width="100%" height="100%" viewBox="0 0 300 300">
      <g><line x1="80" y1="90" x2="220" y2="90"/><line x1="80" y1="90" x2="150" y2="220"/><line x1="220" y1="90" x2="150" y2="220"/></g>
    </svg>
    <div class="node g a1" data-ic="cap" data-s="34"></div>
    <div class="node g a2" data-ic="build" data-s="34"></div>
    <div class="node g a3" data-ic="school" data-s="34"></div>
  </div>
</section>

<!-- ============ NUEVO · GURE GJH HELBURUAK (los 3 ODS de PRAKTIP) ============
     Contenido basado en el «Plan de sostenibilidad» (ODS 5, 8 y 10).
     Banda con foto de personas de fondo (Pexels, licencia libre) atenuada con un velo claro. -->
<div class="band" id="gjh" style="--photo:url('https://images.pexels.com/photos/3184663/pexels-photo-3184663.jpeg?auto=compress&cs=tinysrgb&w=1600')">
  <section class="sec">
    <div class="gj-head"><h2 data-i18n="gjT"></h2><p class="lead" data-i18n="gjS"></p></div>
    <!-- Las 3 tarjetas (imagen oficial del ODS + título + frase) las genera home.js -->
    <div class="gj-grid" id="gj-grid"></div>
  </section>
</div>

<!-- ============ NUEVO · AZTERKETA EKONOMIKOA (análisis económico) ============
     Cifras de la hoja «Azterketa» del Excel del modelo económico (datos hipotéticos, ver ECO en data.js).
     Las tablas y los gráficos SVG los dibujan economia.js y charts.js. -->
<div class="band" id="azterketa" style="--photo:url('https://images.pexels.com/photos/3184356/pexels-photo-3184356.jpeg?auto=compress&cs=tinysrgb&w=1600')">
  <section class="sec">
    <div class="eco-head">
      <h2 data-i18n="ecT"></h2>
      <p class="lead" data-i18n="ecS"></p>
      <span class="tag" data-i18n="dn"></span>
    </div>
    <div class="eco-grid">
      <!-- Tabla 1: indicadores principales -->
      <div class="eco-card g"><h3 data-i18n="ecK"></h3><div class="tw"><table class="tbl" id="eco-kpi"></table></div></div>
      <!-- Tabla 2: facturación por plan -->
      <div class="eco-card g"><h3 data-i18n="ecP"></h3><div class="tw"><table class="tbl" id="eco-plan"></table></div></div>
      <!-- Gráfico 1: barras, facturación mensual año 1 vs año 2 (a todo el ancho) -->
      <div class="eco-card g wide"><h3 data-i18n="ecC1"></h3><div class="chart" id="ch-month"></div><div class="legend" id="lg-month"></div></div>
      <!-- Gráfico 2: anillo, reparto de la facturación del año 2 por plan -->
      <div class="eco-card g"><h3 data-i18n="ecC2"></h3><div class="chart" id="ch-plan"></div><div class="legend" id="lg-plan"></div></div>
      <!-- Gráfico 3: línea, facturación acumulada en 24 meses -->
      <div class="eco-card g"><h3 data-i18n="ecC3"></h3><div class="chart" id="ch-cum"></div></div>
    </div>
    <p class="eco-note" data-i18n="ecN"></p>
  </section>
</div>
</main>

<!-- ============ PIE DE PÁGINA ============ -->
<footer class="g">
  <div class="fg">
    <!-- Columna 1: logo y descripción -->
    <div><a class="logo flogo" href="index.html" aria-label="PRAKTIP"><img class="logo-ic" src="img/icono.svg" alt="" width="43" height="32"><span>PRAKTIP</span></a><p data-i18n="fd"></p></div>
    <!-- Columna 2: navegación -->
    <div><b data-i18n="nv"></b><a href="index.html" data-i18n="home"></a><a href="practicas.html" data-i18n="prac"></a><a href="buscador.html" data-i18n="find"></a><a href="blog.html" data-i18n="blog"></a><a href="login.html" data-i18n="login"></a></div>
    <!-- Columna 3: contacto (ejemplo) y selector de idioma -->
    <div><b data-i18n="ct"></b><p>info@praktip.example<br><span data-i18n="ex"></span></p>
      <div class="sw fsw" role="group" aria-label="Language"><button data-lang="eu">EU</button><button data-lang="es">ES</button></div></div>
  </div>
  <p class="c copy">© 2026 PRAKTIP. <span data-i18n="rt"></span> · <span data-i18n="ph"></span></p>
</footer>

<!-- Scripts (orden importante): datos → lógica común → resto de la página -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/map.js"></script>
<script src="js/charts.js"></script>
<script src="js/economia.js"></script>
<script src="js/home.js"></script>
</body>
</html>
