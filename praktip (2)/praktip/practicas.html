<!DOCTYPE html>
<!-- Página «Te conseguimos las prácticas»: acuerdos con empresas, mapa real y reserva de reunión. -->
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PRAKTIP</title>
  <!-- Tipografías de Google Fonts: Outfit (títulos) y Figtree (texto) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <!-- Hoja de estilos única de la web -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- Fondo fijo con degradados (decorativo) -->
<div class="bg"></div>

<!-- ============ CABECERA (barra fija, igual en todas las páginas) ============ -->
<header class="nav">
  <!-- Píldora izquierda: logo (icono de PRAKTIP) + menú principal + hamburguesa (móvil) -->
  <div class="nb g">
    <a class="logo" href="index.html" aria-label="PRAKTIP"><img class="logo-ic" src="img/icono.svg" alt="" width="43" height="32"><span>PRAKTIP</span></a>
    <nav class="links" aria-label="Main"><a class="nl" href="index.html" data-i18n="home"></a><a class="nl on" href="practicas.html" aria-current="page" data-i18n="prac"></a><a class="nl" href="buscador.html" data-i18n="find"></a><a class="nl" href="blog.html" data-i18n="blog"></a></nav>
    <button class="nl burger" id="burger" aria-expanded="false" aria-controls="dd" aria-label="Menu" data-ic="menu"></button>
  </div>
  <!-- Píldora derecha: acceso al login + selector de idioma EU/ES (main.js lo gestiona) -->
  <div class="nb g r">
    <a class="nl hm" href="login.html" data-i18n="login"></a>
    <div class="sw" role="group" aria-label="Language"><button data-lang="eu">EU</button><button data-lang="es">ES</button></div>
  </div>
  <!-- Menú desplegable de móvil (oculto hasta pulsar la hamburguesa) -->
  <nav class="dd g" id="dd" aria-label="Mobile" hidden><a class="nl" href="index.html" data-i18n="home"></a><a class="nl on" href="practicas.html" aria-current="page" data-i18n="prac"></a><a class="nl" href="buscador.html" data-i18n="find"></a><a class="nl" href="blog.html" data-i18n="blog"></a><a class="nl" href="login.html" data-i18n="login"></a></nav>
</header>

<main class="pg">
<!-- ============ BANNER: cifra de acuerdos + botón que baja a la reserva ============
     (El botón no respondía porque los anillos lo tapaban: arreglado en el CSS con pointer-events:none) -->
<section class="hb">
  <div class="ring r1"></div><div class="ring r2"></div> <!-- anillos decorativos giratorios -->
  <span class="tag" data-i18n="dn"></span>
  <h1 id="pbt"></h1>   <!-- titular con la cifra (lo rellena practicas.js) -->
  <p class="lead" data-i18n="pbS"></p>
  <a class="btn big" href="#book" data-i18n="meet"></a>
</section>

<!-- ============ MARQUESINA DE EMPRESAS (las crea practicas.js) ============ -->
<section class="sec c tight"><h2><span data-i18n="coT"></span> <span class="tag" data-i18n="dn"></span></h2></section>
<div class="mq" aria-hidden="true"><div class="mt" id="cos"></div></div>

<!-- ============ MAPA REAL INTERACTIVO (Leaflet; lo crea map.js en #map-big) ============ -->
<section class="sec" id="map">
  <h2 data-i18n="mapT"></h2>
  <p class="lead mb" data-i18n="mapS"></p>
  <div id="map-big"></div>
</section>

<!-- ============ RESERVA DE REUNIÓN: calendario + formulario (simulado) ============ -->
<section class="sec" id="book">
  <h2 data-i18n="bkT"></h2>
  <p class="lead mb2" data-i18n="bkS"></p>
  <div class="bk" id="bk">
    <!-- Calendario y horas -->
    <div class="g">
      <div class="cal-h">
        <button type="button" class="ar" id="prev" aria-label="Previous month" data-ic="left" data-s="18"></button>
        <b class="cal-m" id="mlabel"></b>
        <button type="button" class="ar" id="next" aria-label="Next month" data-ic="right" data-s="18"></button>
      </div>
      <div class="cal" id="cal"></div>
      <h3 class="slot-h" id="dlabel"></h3>
      <div class="chips" id="slots"></div>
      <p class="er" id="e-dt" role="alert"></p>
    </div>
    <!-- Formulario de contacto -->
    <form class="g" id="bform" novalidate>
      <div class="row">
        <div class="fd"><label for="bn"><span data-i18n="nm"></span> *</label><input id="bn" autocomplete="given-name"><span class="er" id="e-n" role="alert"></span></div>
        <div class="fd"><label for="bs"><span data-i18n="su"></span> *</label><input id="bs" autocomplete="family-name"><span class="er" id="e-s" role="alert"></span></div>
      </div>
      <div class="fd"><label for="be"><span data-i18n="em"></span> *</label><input id="be" type="email"><span class="er" id="e-e" role="alert"></span></div>
      <div class="fd"><label for="bp"><span data-i18n="pf"></span> *</label><select id="bp"></select><span class="er" id="e-p" role="alert"></span></div>
      <div class="fd"><label for="bo" data-i18n="og"></label><input id="bo"></div>
      <div class="fd"><label for="br" data-i18n="rs"></label><input id="br"></div>
      <!-- Fecha y hora elegidas (solo lectura, las rellena el calendario) -->
      <div class="row">
        <div class="fd"><label for="bd" data-i18n="dt"></label><input id="bd" readonly></div>
        <div class="fd"><label for="bh" data-i18n="hr"></label><input id="bh" readonly></div>
      </div>
      <button class="btn mint full" data-i18n="conf"></button>
    </form>
  </div>
  <!-- Pantalla de «reserva confirmada» (oculta hasta enviar el formulario) -->
  <div class="g c done" id="done" hidden>
    <div class="sp"></div><h3 data-i18n="dd"></h3><p class="lead" id="dsum"></p><p class="muted" data-i18n="dx"></p>
    <button type="button" class="btn" id="again" data-i18n="again"></button>
  </div>
</section>
</main>

<!-- ============ PIE DE PÁGINA ============ -->
<footer class="g">
  <div class="fg">
    <!-- Columna 1: logo y descripción -->
    <div><a class="logo flogo" href="index.html" aria-label="PRAKTIP"><img class="logo-ic" src="img/icono.svg" alt="" width="43" height="32"><span>PRAKTIP</span></a><p data-i18n="fd"></p></div>
    <!-- Columna 2: navegación -->
    <div><b data-i18n="nv"></b><a href="index.html" data-i18n="home"></a><a href="practicas.html" data-i18n="prac"></a><a href="buscador.html" data-i18n="find"></a><a href="blog.html" data-i18n="blog"></a><a href="login.html" data-i18n="login"></a></div>
    <!-- Columna 3: contacto (ejemplo) y selector de idioma -->
    <div><b data-i18n="ct"></b><p>info@praktip.example<br><span data-i18n="ex"></span></p>
      <div class="sw fsw" role="group" aria-label="Language"><button data-lang="eu">EU</button><button data-lang="es">ES</button></div></div>
  </div>
  <p class="c copy">© 2026 PRAKTIP. <span data-i18n="rt"></span> · <span data-i18n="ph"></span></p>
</footer>

<!-- Scripts (orden importante): datos → lógica común → resto de la página -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/map.js"></script>
<script src="js/practicas.js"></script>
</body>
</html>
