server {
    listen 80;
    server_name praktip.net www.praktip.net;
    return 301 https://www.praktip.net$request_uri;
}

server {
    listen 443 ssl;
    server_name praktip.net;

    ssl_certificate	/etc/nginx/certs/praktip.crt;
    ssl_certificate_key /etc/nginx/certs/praktip.key;
    ssl_protocols	TLSv1.2 TLSv1.3;

    return 301 https://www.praktip.net$request_uri;
}

server {
    listen 443 ssl;
    server_name www.praktip.net;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate	/etc/nginx/certs/praktip.crt;
    ssl_certificate_key /etc/nginx/certs/praktip.key;
    ssl_protocols	TLSv1.2 TLSv1.3;


    location / { try_files $uri $uri/ $uri.html =404; }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
