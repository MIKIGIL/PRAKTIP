  <main>
    <section class="zentratua">
      <div class="txartela kutxa">
        <h1>Probatu dohainik</h1>
        <p class="sarrera" style="margin-bottom: 20px; color: var(--grisa)">[Probaren azalpen laburra.]</p>
        <!-- Backend-ik ez dago: formularioak ez du daturik bidaltzen -->
        <form class="formularioa" onsubmit="event.preventDefault()">
          <div class="eremua"><label for="p-izena">Izena</label><input class="sarrera-eremua" id="p-izena" name="izena" type="text" autocomplete="name" required></div>
          <div class="eremua"><label for="p-sektorea">Bilatzen duzun lan-sektorea</label><input class="sarrera-eremua" id="p-sektorea" name="sektorea" type="text" required></div>
          <div class="eremua"><label for="p-kokapena">Gutxi gorabeherako kokapena</label><input class="sarrera-eremua" id="p-kokapena" name="kokapena" type="text" autocomplete="address-level2" required></div>
          <div class="eremua"><label for="p-cv">Curriculuma igo</label><input class="sarrera-eremua" id="p-cv" name="cv" type="file" accept=".pdf,.doc,.docx" required></div>
          <button class="btn btn-anbar" type="submit" style="font-size: 18px">Bidali eta probatu</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="oina">
    <strong>PRAKTIP</strong>
    <span>2MSS2 · Ikasenpresa · 2026</span>
