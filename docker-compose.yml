services:
  nginx:
    image: nginx:alpine
    container_name: praktip-web
    ports:
      - "${PRAKTIP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
